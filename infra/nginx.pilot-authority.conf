server {
    listen 8443 ssl;
    server_name pilot-authority;
    ssl_certificate /run/pilot/tls.crt;
    ssl_certificate_key /run/pilot/tls.key;
    ssl_client_certificate /run/pilot/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    access_log off;
    error_log /dev/stderr crit;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $owner_backend monitor:8000;
    location /api/pilot/internal/ {
        proxy_pass http://$owner_backend$request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
