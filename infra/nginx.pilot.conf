server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    access_log off;
    error_log /dev/stderr crit;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $pilot_backend pilot-api:8443;
    set $servicing_backend pilot-servicing:8443;
    set $servicing_peer pilot-peer-uk:8443;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { return 200 'pilot gateway alive\n'; }
    location = /lab-config.json {
        alias /etc/nginx/lab-config.pilot.json;
        default_type application/json;
        add_header Cache-Control 'no-store' always;
    }
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }
    location = / { try_files /pilot.html =404; }
    location /pilot/ {
        proxy_pass https://$pilot_backend$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name pilot-api;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/pilot/ca.crt;
        proxy_ssl_certificate /run/pilot/tls.crt;
        proxy_ssl_certificate_key /run/pilot/tls.key;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        add_header Cache-Control 'no-store' always;
    }
    location = /openapi.json {
        proxy_pass https://$pilot_backend$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name pilot-api;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/pilot/ca.crt;
        proxy_ssl_certificate /run/pilot/tls.crt;
        proxy_ssl_certificate_key /run/pilot/tls.key;
    }
    location /service/system/ {
        proxy_pass https://$servicing_backend$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name pilot-servicing;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/pilot/ca.crt;
        proxy_ssl_certificate /run/pilot/tls.crt;
        proxy_ssl_certificate_key /run/pilot/tls.key;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        add_header Cache-Control 'no-store' always;
    }
    location = /service/api-docs {
        proxy_pass https://$servicing_backend$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name pilot-servicing;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/pilot/ca.crt;
        proxy_ssl_certificate /run/pilot/tls.crt;
        proxy_ssl_certificate_key /run/pilot/tls.key;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        add_header Cache-Control 'no-store' always;
    }
    location = /service/openapi.json {
        proxy_pass https://$servicing_backend$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name pilot-servicing;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/pilot/ca.crt;
        proxy_ssl_certificate /run/pilot/tls.crt;
        proxy_ssl_certificate_key /run/pilot/tls.key;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        add_header Cache-Control 'no-store' always;
    }
    location /service/experience/ {
        proxy_pass https://$servicing_peer$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name pilot-peer-uk;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/pilot/ca.crt;
        proxy_ssl_certificate /run/pilot/tls.crt;
        proxy_ssl_certificate_key /run/pilot/tls.key;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        add_header Cache-Control 'no-store' always;
    }
    location /service/internal/ { return 404; }
    location /internal/ { return 404; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
