# Docker service addresses can change during an image upgrade or API restart.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream monitor_api {
    zone monitor_api 64k;
    server monitor:8000 resolve;
}
upstream grafana_ui {
    zone grafana_ui 64k;
    server grafana:3000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'gateway alive\n'; }
    location = /lab-config.json {
        alias /etc/nginx/lab-config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location = /grafana { return 302 /grafana/; }
    location /grafana/ {
        proxy_pass http://grafana_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/cluster-control/ {
        proxy_pass http://monitor_api;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store";
    }
    location /api/ {
        proxy_pass http://monitor_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }
    location = /api-docs { proxy_pass http://monitor_api; }
    location = /openapi.json { proxy_pass http://monitor_api; }
    # Nginx's bundled mime.types omits .mjs. Browsers reject module imports
    # served as application/octet-stream, leaving live pages at Connecting.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
