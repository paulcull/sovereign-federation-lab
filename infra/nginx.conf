server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'gateway alive\n'; }
    location = /lab-config.json {
        alias /etc/nginx/lab-config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location /api/ {
        proxy_pass http://monitor:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }
    location = /api-docs { proxy_pass http://monitor:8000; }
    location = /openapi.json { proxy_pass http://monitor:8000; }
    location / { try_files $uri $uri/ =404; }
}
