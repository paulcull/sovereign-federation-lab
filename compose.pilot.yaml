    "pilot-authority": {
      "image": "nginx:1.28.0-alpine",
      "volumes": [
        "./infra/nginx.pilot-authority.conf:/etc/nginx/conf.d/default.conf:ro",
        "./.pilot/authority:/run/pilot:ro"
      ],
      "depends_on": {
        "monitor": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped"
    },
    "pilot-gateway": {
      "build": {
        "context": ".",
        "dockerfile": "infra/Gateway.Dockerfile"
      },
      "ports": [
        "127.0.0.1:${PILOT_PORT:-8081}:8080"
      ],
      "volumes": [
        "./infra/nginx.pilot.conf:/etc/nginx/conf.d/default.conf:ro",
        "./.pilot/authority:/run/pilot:ro"
      ],
      "depends_on": {
        "pilot-api": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-Y",
          "off",
          "-q",
          "--spider",
          "http://127.0.0.1:8080/healthz"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "pilot-servicing": {
      "image": "sovereign-federation-pilot:local",
      "command": [
