name: CockroachDB lab acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install locked security and browser tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
          bash scripts/install_trivy.sh "$RUNNER_TEMP/sfl-security-bin"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/sfl-security-bin" >> "$GITHUB_PATH"
      - name: Build and start CockroachDB lab
        run: |
          mkdir -p artifacts
          ./lab doctor 2>&1 | tee artifacts/doctor.txt
          ./lab up 2>&1 | tee artifacts/startup.log
      - name: Execute integration and restart gates
        run: ./lab test 2>&1 | tee artifacts/acceptance.log
      - name: Actual OPA and Collector outage gates
        run: ./lab faults 2>&1 | tee artifacts/faults.log
      - name: Install browser acceptance tools
        run: |
          python3 -m playwright install --with-deps chromium
      - name: Live Chromium generator and migration walkthrough
        run: python3 poc/tests/browser_acceptance.py 2>&1 | tee artifacts/browser.log
      - name: Microsite reader journey
        run: python3 design/tests/reader_browser.py 2>&1 | tee artifacts/reader-guide.log
      - name: Wire synthetic customer MDM pilot
        run: ./lab pilot-up 2>&1 | tee artifacts/pilot-startup.log
      - name: System, experience and foundation SQL/OPA acceptance
        run: ./lab pilot-test 2>&1 | tee artifacts/pilot-acceptance.log
      - name: Real pilot outages, recovery and read isolation
        run: ./lab pilot-faults 2>&1 | tee artifacts/pilot-faults.log
      - name: Live MDM system and experience browser walkthrough
        run: python3 poc/tests/pilot_browser.py 2>&1 | tee artifacts/pilot-browser.log
      - name: Cluster control native recovery, persistence and database outage
        run: |
          LAB_PILOT=1 ./lab cluster-test 2>&1 | tee artifacts/cluster-control.log
          LAB_PILOT=1 ./lab cluster-faults 2>&1 | tee artifacts/cluster-control-faults.log
          python3 poc/tests/cluster_control_browser.py 2>&1 | tee artifacts/cluster-control-browser.log
      - name: Audit locked dependencies and built container images
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/audit_dependencies.py --risk-context synthetic-lab 2>&1 | tee artifacts/security.log
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/containers.txt
          docker compose logs --no-color > artifacts/containers.log
          if [ -f .pilot/ready.json ]; then
            docker compose -f compose.yaml -f compose.pilot.yaml ps --all > artifacts/pilot-containers.txt
            docker compose -f compose.yaml -f compose.pilot.yaml logs --no-color > artifacts/pilot-containers.log
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lab-evidence
          path: artifacts/
      - name: Stop lab
        if: always()
        run: |
          if [ -f .pilot/ready.json ]; then ./lab pilot-down; else ./lab down; fi
