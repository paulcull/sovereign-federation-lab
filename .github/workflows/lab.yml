name: CockroachDB lab acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start CockroachDB lab
        run: ./lab up
      - name: Execute integration and restart gates
        run: ./lab test
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/containers.txt
          docker compose logs --no-color > artifacts/containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-evidence
          path: artifacts/
      - name: Stop lab
        if: always()
        run: ./lab down
