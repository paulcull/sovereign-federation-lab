name: CockroachDB lab acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and start CockroachDB lab
        run: |
          mkdir -p artifacts
          ./lab doctor 2>&1 | tee artifacts/doctor.txt
          ./lab up 2>&1 | tee artifacts/startup.log
      - name: Execute integration and restart gates
        run: ./lab test 2>&1 | tee artifacts/acceptance.log
      - name: Actual OPA and Collector outage gates
        run: ./lab faults 2>&1 | tee artifacts/faults.log
      - name: Install browser acceptance tools
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Live Chromium generator and migration walkthrough
        run: python3 poc/tests/browser_acceptance.py 2>&1 | tee artifacts/browser.log
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/containers.txt
          docker compose logs --no-color > artifacts/containers.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lab-evidence
          path: artifacts/
      - name: Stop lab
        if: always()
        run: ./lab down
